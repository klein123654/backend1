name: Keep Render backend awake

# Render's free tier sleeps after ~15 minutes without traffic, which makes the
# first visitor wait 30-60 seconds. Pinging the health check keeps it warm.
# Set the BACKEND_HEALTH_URL repository variable to override the default URL.

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping health endpoint
        run: curl --fail --silent --show-error --max-time 90 --retry 2 "${URL}" -o /dev/null
        env:
          URL: ${{ vars.BACKEND_HEALTH_URL || 'https://backend1-3fwi.onrender.com/up' }}
